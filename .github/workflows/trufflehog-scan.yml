name: TruffleHog

# This repo's own scans: calls the shared reusable workflow in this same repo.
on:
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 1,15 * *'   # 1st and 15th, full history
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  trufflehog:
    uses: ./.github/workflows/trufflehog.yml
    with:
      scan: ${{ github.event_name == 'pull_request' && 'pr' || 'full' }}
      mode: report
    secrets: inherit
