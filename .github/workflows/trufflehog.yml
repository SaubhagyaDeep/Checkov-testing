name: TruffleHog (reusable)

# Callers: pin this workflow by commit SHA. Caller must grant
#   permissions: { contents: read, pull-requests: write }
# Monitoring mode by default; block on ANY finding with `mode: block` or the TRUFFLEHOG_ENFORCE variable.
# `results` defaults to verified,unverified; set `results: verified` per repo for low noise.
on:
  workflow_call:
    inputs:
      scan:
        description: "pr (PR commits only) or full (entire history)"
        type: string
        default: pr
      results:
        description: "TruffleHog result types: verified, unverified, unknown, filtered_unverified (comma-separated)"
        type: string
        default: verified,unverified
      mode:
        description: "report (never fails) or block (fail on verified secrets)"
        type: string
        default: report
    secrets:
      SECOPS_SLACK_WEBHOOK_URL:
        description: Slack incoming webhook for the SecOps channel (full scans only)
        required: false

jobs:
  trufflehog:
    name: TruffleHog secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      # The allowlist comes from the checked-out tree, so an entry added in the same PR applies.
      # Every suppressed finding is listed in the PR comment for reviewers; protect the file with CODEOWNERS.
      - name: Resolve allowlist
        id: allowlist
        run: |
          OUT="$RUNNER_TEMP/allowlist.yaml"
          if [ -f .github/trufflehog/allowlist.yaml ]; then
            cp .github/trufflehog/allowlist.yaml "$OUT"
          else
            printf 'allowlist: []\n' > "$OUT"
          fi
          echo "file=$OUT" >> "$GITHUB_OUTPUT"

      - name: Scan
        id: scan
        uses: SaubhagyaDeep/Checkov-testing/.github/actions/trufflehog-scan@83f14c4794095e26fd68fd41b3863107e5080c17
        with:
          scan: ${{ inputs.scan }}
          results: ${{ inputs.results }}
          base-sha: ${{ github.event.pull_request.base.sha }}
          head-sha: ${{ github.event.pull_request.head.sha }}
          allowlist-file: ${{ steps.allowlist.outputs.file }}

      - name: Write job summary
        run: cat "${{ steps.scan.outputs.report-dir }}/comment.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Find existing TruffleHog PR comment
        if: inputs.scan == 'pr'
        id: find-comment
        uses: peter-evans/find-comment@b30e6a3c0ed37e7c023ccd3f1db5c6c0b0c23aad # v4
        continue-on-error: true
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: 'github-actions[bot]'
          body-includes: '<!-- trufflehog-report -->'

      - name: Post or update TruffleHog PR comment
        if: inputs.scan == 'pr' && (steps.scan.outputs.count != '0' || steps.scan.outputs.suppressed != '0' || steps.find-comment.outputs.comment-id != '')
        uses: peter-evans/create-or-update-comment@71345be0265236311c031f5c7866368bd1eff043 # v4
        with:
          comment-id: ${{ steps.find-comment.outputs.comment-id }}
          issue-number: ${{ github.event.pull_request.number }}
          body-path: ${{ steps.scan.outputs.report-dir }}/comment.md
          edit-mode: replace

      - name: Notify SecOps Slack channel
        if: inputs.scan == 'full' && steps.scan.outputs.count != '0'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SECOPS_SLACK_WEBHOOK_URL }}
          COUNT: ${{ steps.scan.outputs.count }}
          REPORT_DIR: ${{ steps.scan.outputs.report-dir }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "::error::SECOPS_SLACK_WEBHOOK_URL secret is not configured"
            exit 1
          fi
          # Redacted summary only: detector, file:line, short commit. Capped at 20 rows.
          VERIFIED=$(jq '[.[]|select(.verified)]|length' "$REPORT_DIR/findings.json")
          DETAILS=$(jq -r '.[:20][] | "• \(.detector) — \(.file):\(.line) (\(.commit[0:10]))"' "$REPORT_DIR/findings.json")
          jq -n --arg text "*TruffleHog: $COUNT secret(s) ($VERIFIED verified) in ${GITHUB_REPOSITORY}* (full-history scan)
          $DETAILS
          <$RUN_URL|View run>" '{text: $text}' \
            | curl -sSf -X POST -H 'Content-type: application/json' --data @- "$SLACK_WEBHOOK_URL"

      - name: Fail on verified secrets (block mode only)
        if: (inputs.mode == 'block' || vars.TRUFFLEHOG_ENFORCE == 'true') && inputs.scan == 'pr' && steps.scan.outputs.count != '0'
        run: |
          echo "::error::TruffleHog found ${{ steps.scan.outputs.count }} secret(s). See the PR comment."
          exit 1
