name: TruffleHog (reusable)

# Callers: pin this workflow by commit SHA. Caller must grant
#   permissions: { contents: read, pull-requests: write }
# Monitoring mode by default; block on ANY finding with `mode: block` or the TRUFFLEHOG_ENFORCE variable.
# `results` defaults to verified,unverified; set `results: verified` per repo for low noise.
on:
  workflow_call:
    inputs:
      scan:
        description: "pr (PR commits only) or full (entire history)"
        type: string
        default: pr
      results:
        description: "TruffleHog result types: verified, unverified, unknown, filtered_unverified (comma-separated)"
        type: string
        default: verified,unverified
      notify-slack:
        description: "findings (Slack only when a full scan finds something) or always (also post an all-clear)"
        type: string
        default: findings
      mode:
        description: "report (never fails) or block (fail on verified secrets)"
        type: string
        default: report
    secrets:
      SLACK_BOT_TOKEN:
        description: Slack bot token (chat:write, bot must be in the channel); full scans only
        required: false

jobs:
  trufflehog:
    name: TruffleHog secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      # The allowlist comes from the checked-out tree, so an entry added in the same PR applies.
      # Every suppressed finding is listed in the PR comment for reviewers; protect the file with CODEOWNERS.
      - name: Resolve allowlist
        id: allowlist
        run: |
          OUT="$RUNNER_TEMP/allowlist.yaml"
          if [ -f .github/trufflehog/allowlist.yaml ]; then
            cp .github/trufflehog/allowlist.yaml "$OUT"
          else
            printf 'allowlist: []\n' > "$OUT"
          fi
          echo "file=$OUT" >> "$GITHUB_OUTPUT"

      - name: Scan
        id: scan
        uses: SaubhagyaDeep/Checkov-testing/.github/actions/trufflehog-scan@83f14c4794095e26fd68fd41b3863107e5080c17
        with:
          scan: ${{ inputs.scan }}
          results: ${{ inputs.results }}
          base-sha: ${{ github.event.pull_request.base.sha }}
          head-sha: ${{ github.event.pull_request.head.sha }}
          allowlist-file: ${{ steps.allowlist.outputs.file }}

      - name: Write job summary
        run: cat "${{ steps.scan.outputs.report-dir }}/comment.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Find existing TruffleHog PR comment
        if: inputs.scan == 'pr'
        id: find-comment
        uses: peter-evans/find-comment@b30e6a3c0ed37e7c023ccd3f1db5c6c0b0c23aad # v4
        continue-on-error: true
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: 'github-actions[bot]'
          body-includes: '<!-- trufflehog-report -->'

      - name: Post or update TruffleHog PR comment
        if: inputs.scan == 'pr' && (steps.scan.outputs.count != '0' || steps.scan.outputs.suppressed != '0' || steps.find-comment.outputs.comment-id != '')
        uses: peter-evans/create-or-update-comment@71345be0265236311c031f5c7866368bd1eff043 # v4
        with:
          comment-id: ${{ steps.find-comment.outputs.comment-id }}
          issue-number: ${{ github.event.pull_request.number }}
          body-path: ${{ steps.scan.outputs.report-dir }}/comment.md
          edit-mode: replace

      # Needs secret SLACK_BOT_TOKEN and variable SECOPS_SLACK_CHANNEL_ID in the caller repo (or org).
      # Optional variable SECOPS_SLACK_MENTIONS, e.g. "<@U01ABC> <@U02DEF>" (Slack member IDs), pinged on findings.
      - name: Notify Slack
        if: inputs.scan == 'full' && (steps.scan.outputs.count != '0' || inputs.notify-slack == 'always')
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL: ${{ vars.SECOPS_SLACK_CHANNEL_ID }}
          MENTIONS: ${{ vars.SECOPS_SLACK_MENTIONS }}
          COUNT: ${{ steps.scan.outputs.count }}
          REPORT_DIR: ${{ steps.scan.outputs.report-dir }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$SLACK_BOT_TOKEN" ] || [ -z "$SLACK_CHANNEL" ]; then
            echo "::error::SLACK_BOT_TOKEN secret and SECOPS_SLACK_CHANNEL_ID variable are required"
            exit 1
          fi
          esc() { sed -e 's/&/\&amp;/g' -e 's/</\&lt;/g' -e 's/>/\&gt;/g'; }
          if [ "$COUNT" = "0" ]; then
            TEXT=":white_check_mark: *TruffleHog: no secrets found* in ${GITHUB_REPOSITORY} (full-history scan) <$RUN_URL|View run>"
          else
            VERIFIED=$(jq '[.[]|select(.verified)]|length' "$REPORT_DIR/findings.json")
            # Redacted table only: detector, file:line, short commit. Capped at 20 rows, aligned in a code block.
            TABLE=$( { printf 'Detector\tFile path\tCommit\n'; \
              jq -r '.[:20][] | [.detector, "\(.file):\(.line)", .commit[0:10]] | @tsv' "$REPORT_DIR/findings.json"; } \
              | column -t -s "$(printf '\t')" | esc)
            TEXT=":rotating_light: *TruffleHog: $COUNT secret(s) ($VERIFIED verified)* in ${GITHUB_REPOSITORY} (full-history scan)"
            if [ -n "$MENTIONS" ]; then TEXT="$TEXT"$'\n'"$MENTIONS pls look into this:"; fi
            TEXT="$TEXT"$'\n''```'$'\n'"$TABLE"$'\n''```'$'\n'"<$RUN_URL|View run>"
          fi
          RESP=$(jq -n --arg channel "$SLACK_CHANNEL" --arg text "$TEXT" '{channel: $channel, text: $text}' \
            | curl -sS -X POST https://slack.com/api/chat.postMessage \
                -H "Authorization: Bearer $SLACK_BOT_TOKEN" \
                -H 'Content-type: application/json; charset=utf-8' --data @-)
          if ! echo "$RESP" | jq -e '.ok' >/dev/null; then
            echo "::error::Slack API error: $(echo "$RESP" | jq -r '.error // "unknown"')"
            exit 1
          fi

      - name: Fail on verified secrets (block mode only)
        if: (inputs.mode == 'block' || vars.TRUFFLEHOG_ENFORCE == 'true') && inputs.scan == 'pr' && steps.scan.outputs.count != '0'
        run: |
          echo "::error::TruffleHog found ${{ steps.scan.outputs.count }} secret(s). See the PR comment."
          exit 1
