name: TruffleHog Secret Scan

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: trufflehog-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  # trufflehog v3.100.0 (action commit d232362a64a09a9e7d58267b8f5acef00ae90e23), pinned by image digest.
  # We run the image directly instead of trufflesecurity/trufflehog because the action prints raw
  # secret values to the job log and hard-fails on findings; we need redaction and a monitoring mode.
  TRUFFLEHOG_IMAGE: ghcr.io/trufflesecurity/trufflehog@sha256:8fd07ea46a3f59583c4d50f006d8cf150530141b28969c3c34cc455cb9165a6b

jobs:
  trufflehog:
    name: TruffleHog verified-secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run TruffleHog (verified only)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # Raw output holds secret values: keep it in RUNNER_TEMP, never log or upload it.
          docker run --rm -v "$PWD":/repo:ro -w /repo "$TRUFFLEHOG_IMAGE" \
            git file:///repo \
            --since-commit "$BASE_SHA" --branch "$HEAD_SHA" \
            --results=verified --json --no-update \
            --force-skip-binaries --archive-max-size=5MB \
            > "$RUNNER_TEMP/trufflehog-raw.jsonl"

      - name: Redact and apply allowlist
        id: report
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet pyyaml==6.0.2
          "$RUNNER_TEMP/venv/bin/python" .github/trufflehog/process_findings.py \
            "$RUNNER_TEMP/trufflehog-raw.jsonl" \
            .github/trufflehog/allowlist.yaml \
            "$RUNNER_TEMP/trufflehog-out"
          rm -f "$RUNNER_TEMP/trufflehog-raw.jsonl"

      - name: Write job summary
        run: cat "$RUNNER_TEMP/trufflehog-out/comment.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Find existing TruffleHog PR comment
        id: find-comment
        uses: peter-evans/find-comment@b30e6a3c0ed37e7c023ccd3f1db5c6c0b0c23aad # v4
        continue-on-error: true
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: 'github-actions[bot]'
          body-includes: '<!-- trufflehog-report -->'

      # Sticky comment: create on first finding, update afterwards (including the all-clear).
      - name: Post or update TruffleHog PR comment
        if: steps.report.outputs.count != '0' || steps.find-comment.outputs.comment-id != ''
        uses: peter-evans/create-or-update-comment@71345be0265236311c031f5c7866368bd1eff043 # v4
        with:
          comment-id: ${{ steps.find-comment.outputs.comment-id }}
          issue-number: ${{ github.event.pull_request.number }}
          body-path: ${{ runner.temp }}/trufflehog-out/comment.md
          edit-mode: replace

      # Monitoring mode by default. Set repository/org variable TRUFFLEHOG_ENFORCE=true to block.
      - name: Fail on verified secrets (enforcement mode only)
        if: vars.TRUFFLEHOG_ENFORCE == 'true' && steps.report.outputs.count != '0'
        run: |
          echo "::error::TruffleHog found ${{ steps.report.outputs.count }} verified secret(s). See the PR comment."
          exit 1
