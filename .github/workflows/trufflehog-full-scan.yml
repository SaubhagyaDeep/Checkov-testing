name: TruffleHog Full History Scan

on:
  schedule:
    # 1st and 15th of each month, 06:00 UTC (twice monthly ≈ biweekly)
    - cron: '0 6 1,15 * *'
  workflow_dispatch:

permissions:
  contents: read

env:
  # trufflehog v3.100.0, pinned by image digest (see trufflehog-pr.yml for why we don't use the action).
  TRUFFLEHOG_IMAGE: ghcr.io/trufflesecurity/trufflehog@sha256:8fd07ea46a3f59583c4d50f006d8cf150530141b28969c3c34cc455cb9165a6b

jobs:
  full-scan:
    name: TruffleHog full-history scan
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository (full history)
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run TruffleHog (verified only)
        run: |
          docker run --rm -v "$PWD":/repo:ro -w /repo "$TRUFFLEHOG_IMAGE" \
            git file:///repo \
            --results=verified --json --no-update \
            --force-skip-binaries --archive-max-size=5MB \
            > "$RUNNER_TEMP/trufflehog-raw.jsonl"

      - name: Redact and apply allowlist
        id: report
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet pyyaml==6.0.2
          "$RUNNER_TEMP/venv/bin/python" .github/trufflehog/process_findings.py \
            "$RUNNER_TEMP/trufflehog-raw.jsonl" \
            .github/trufflehog/allowlist.yaml \
            "$RUNNER_TEMP/trufflehog-out"
          rm -f "$RUNNER_TEMP/trufflehog-raw.jsonl"

      - name: Notify SecOps Slack channel
        if: steps.report.outputs.count != '0'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SECOPS_SLACK_WEBHOOK_URL }}
          COUNT: ${{ steps.report.outputs.count }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "::error::SECOPS_SLACK_WEBHOOK_URL secret is not configured"
            exit 1
          fi
          # Redacted summary only: detector, file:line, short commit. Capped at 20 rows.
          DETAILS=$(jq -r '.[:20][] | "• \(.detector) — \(.file):\(.line) (\(.commit[0:10]))"' \
            "$RUNNER_TEMP/trufflehog-out/findings.json")
          jq -n --arg text "*TruffleHog: $COUNT verified secret(s) in ${GITHUB_REPOSITORY}* (full-history scan)
          $DETAILS
          <$RUN_URL|View run>" '{text: $text}' \
            | curl -sSf -X POST -H 'Content-type: application/json' --data @- "$SLACK_WEBHOOK_URL"

      - name: Summarize
        if: always()
        run: cat "$RUNNER_TEMP/trufflehog-out/comment.md" >> "$GITHUB_STEP_SUMMARY" || true
